name: Post Release to X

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  post-to-x:
    runs-on: ubuntu-latest

    steps:
      - name: Post release to X
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}

          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          client_id = os.environ["X_CLIENT_ID"]
          client_secret = os.environ["X_CLIENT_SECRET"]
          access_token = os.environ["X_ACCESS_TOKEN"]
          refresh_token = os.environ["X_REFRESH_TOKEN"]

          # Refresh the OAuth 2.0 access token
          data = urllib.parse.urlencode({
              "refresh_token": refresh_token,
              "grant_type": "refresh_token",
              "client_id": client_id,
          }).encode()

          credentials = f"{client_id}:{client_secret}".encode()
          import base64

          auth = base64.b64encode(credentials).decode()

          refresh_request = urllib.request.Request(
              "https://api.x.com/2/oauth2/token",
              data=data,
              headers={
                  "Authorization": f"Basic {auth}",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          with urllib.request.urlopen(refresh_request) as response:
              token_data = json.loads(response.read().decode())

          access_token = token_data["access_token"]

          # Build the release post
          title = os.environ.get("RELEASE_TITLE") or "Unknown version"
          body = os.environ.get("RELEASE_BODY") or "No changes listed."
          url = os.environ["RELEASE_URL"]

          prefix = f"Fluide {title} released!\n\nWhat's news:\n"
          suffix = f"\n\nGet now at {url}"

          available = 280 - len(prefix) - len(suffix)

          if available < 1:
              raise RuntimeError("Release title or URL is too long.")

          if len(body) > available:
              body = body[:available - 1].rstrip() + "…"

          text = prefix + body + suffix

          # Post to X
          payload = json.dumps({
              "text": text
          }).encode()

          post_request = urllib.request.Request(
              "https://api.x.com/2/tweets",
              data=payload,
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(post_request) as response:
              result = json.loads(response.read().decode())

          print("Successfully posted release to X!")
          print(f"Post ID: {result['data']['id']}")
          PY
